<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Sem <meta name="viewport">, de propósito -- deve disparar o
       aviso "Missing <meta name=viewport> tag". -->
  <title>Página quebrada (fixture de teste)</title>
  <style>
    body { margin: 0; }
    .too-wide { width: 3000px; height: 10px; background: red; }
  </style>
</head>
<body>
  <h1>Fixture de teste</h1>
  <!-- Elemento sem alt -- deve disparar violação de acessibilidade (axe: image-alt). -->
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7" />
  <div class="too-wide"></div>
  <script>
    console.error("erro deliberado de teste no console");
    // Requisição para host fora da allowlist -- deve ser bloqueada
    // pela política de rede e aparecer em security.blockedRequests.
    fetch("http://exemplo-nao-permitido.invalid/recurso").catch(() => {});
  </script>
</body>
</html>
