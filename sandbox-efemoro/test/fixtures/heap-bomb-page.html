<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Página que aloca memória sem limite (fixture de teste)</title>
</head>
<body>
  <h1>Heap bomb</h1>
  <script>
    // Loop síncrono, direto no parser -- mesmo raciocínio de
    // cpu-bomb-page.html. Aloca memória sem parar até o V8 matar a
    // aba por estourar --js-flags=--max-old-space-size (ver
    // browser.js); a navegação em si é o ponto onde o crash aparece.
    window.__arr = [];
    while (true) {
      window.__arr.push(new Array(1_000_000).fill("x"));
    }
  </script>
</body>
</html>
