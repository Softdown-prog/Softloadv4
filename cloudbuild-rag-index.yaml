# Reindexa o catálogo RAG depois de alterações na fonte. Este arquivo é
# chamado pelo gatilho "rag-embed-index" do Cloud Build; não faz deploy da
# aplicação. A identidade do gatilho chama o serviço privado via IAM e lê o
# segredo apenas no runtime deste build.
steps:
  - id: instalar-dependencias
    name: node:22
    entrypoint: npm
    # O lock atual ainda não está sincronizado com package.json. `install`
    # mantém o build funcional até essa manutenção ser feita, sem rodar os
    # scripts de pós-instalação da aplicação no ambiente de indexação.
    args: [install, --ignore-scripts, --no-audit, --no-fund]

  # Cloud Build não expõe uma service account na metadata server do
  # container. Este token de curta duração é gerado via IAM e usado somente
  # pela próxima etapa; nunca é impresso em log nem salvo no repositório.
  - id: gerar-id-token-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        gcloud auth print-identity-token \
          --audiences=https://embeddings-service-1010038095056.us-central1.run.app \
          > /workspace/embeddings-id-token

  - id: indexar-catalogo-rag
    name: node:22
    entrypoint: sh
    args:
      - -c
      - |
        export EMBEDDINGS_ID_TOKEN="$(cat /workspace/embeddings-id-token)"
        npm run rag:embed-index
    env:
      - EMBEDDINGS_SERVICE_URL=https://embeddings-service-1010038095056.us-central1.run.app
      - EMBEDDINGS_IAM_AUTH=true
    secretEnv: [EMBEDDINGS_SHARED_SECRET]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/embeddings-shared-secret/versions/latest
      env: EMBEDDINGS_SHARED_SECRET

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
