name: Supersede obsolete VPS deploys safely

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  release-stale-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel outdated runs before activation only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          latest="$(gh api "repos/$repo/commits/main" --jq '.sha')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          runs="$(gh api "repos/$repo/actions/workflows/deploy.yml/runs?per_page=30")"
          mapfile -t stale < <(jq -r --arg latest "$latest" '.workflow_runs[] | select(.head_sha != $latest and .status != "completed") | .id' <<< "$runs")
          if [ "${#stale[@]}" -eq 0 ]; then
            echo "[SUPERSEDE] No obsolete active deploy found."
            exit 0
          fi
          for id in "${stale[@]}"; do
            echo "[SUPERSEDE] Checking outdated deploy run $id"
            job_list="$(gh api "repos/$repo/actions/runs/$id/jobs?per_page=100")"
            # Never terminate a run once the deployment/rollback operation
            # has started, even if main advances during activation.
            if jq -e '[.jobs[] | select(.name == "activate" and (.status == "in_progress" or .status == "completed"))] | length > 0' <<< "$job_list" >/dev/null; then
              echo "[SUPERSEDE] Run $id already reached activation; leave it untouched."
              continue
            fi
            # Double-check the run is still active before requesting cancellation.
            state="$(gh api "repos/$repo/actions/runs/$id" --jq '.status')"
            if [ "$state" = "completed" ]; then
              echo "[SUPERSEDE] Run $id already finished."
              continue
            fi
            echo "[SUPERSEDE] Cancel obsolete run $id before activation; newest is $latest."
            gh api -X POST "repos/$repo/actions/runs/$id/cancel"
          done
