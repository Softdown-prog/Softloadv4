name: Marketing - Video Solaris Code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/record-solaris-demo.ts'
      - 'scripts/marketing/record-solaris-demo.test.cjs'
      - '.github/workflows/marketing-solaris-demo.yml'

permissions:
  contents: read

jobs:
  gravar-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verificar roteiro e compilar frontend
        run: |
          node --experimental-strip-types --check .github/scripts/record-solaris-demo.ts
          node --test scripts/marketing/record-solaris-demo.test.cjs
          npm run typecheck:frontend
          npm run build
      - name: Instalar apenas Chromium Headless Shell
        run: |
          # --with-deps executava apt no runner; o espelho Ubuntu consumiu
          # mais de 20 minutos no primeiro teste, sem chegar à captura.
          # O runner GitHub já fornece bibliotecas de execução usuais.
          npm install --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund playwright@1.56.1
          npx playwright install --only-shell chromium
      - name: Disponibilizar FFmpeg estatico sem apt
        run: |
          set -euo pipefail
          media_dir="${RUNNER_TEMP}/solaris-video-media"
          npm install --prefix "$media_dir" --no-save --ignore-scripts --no-audit --no-fund --package-lock=false \
            @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          install -d "$media_dir/bin"
          ffmpeg_binary="$media_dir/node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
          ffprobe_binary="$media_dir/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          chmod +x "$ffmpeg_binary" "$ffprobe_binary"
          ln -s "$ffmpeg_binary" "$media_dir/bin/ffmpeg"
          ln -s "$ffprobe_binary" "$media_dir/bin/ffprobe"
          echo "$media_dir/bin" >> "$GITHUB_PATH"
          "$ffmpeg_binary" -hide_banner -encoders 2>/dev/null | grep -F libx264
          "$ffprobe_binary" -version >/dev/null
      - name: Capturar conversa demonstrativa em MP4
        run: |
          node --experimental-strip-types .github/scripts/record-solaris-demo.ts out/solaris-demo
          ffmpeg -hide_banner -loglevel error -y -i out/solaris-demo/solaris-demo-real-ui.webm \
            -an -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 22 \
            -movflags +faststart out/solaris-demo/solaris-demo.mp4
          test -s out/solaris-demo/solaris-demo.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/solaris-demo/solaris-demo.mp4
      - name: Salvar video e evidencias para revisao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softload-v4-solaris-demo-revisao
          path: |
            out/solaris-demo/solaris-demo.mp4
            out/solaris-demo/solaris-demo-final.png
            out/solaris-demo/demo-manifest.json
          retention-days: 14
          if-no-files-found: warn
