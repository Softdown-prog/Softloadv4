name: Softload Blogger - CI principal
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: TypeScript, Blogger, cobranÃ§a e Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependÃªncias
        run: npm ci --legacy-peer-deps
      - name: Verificar contratos TypeScript e espelhos JS
        run: npm run typecheck
      - name: Verificar scripts JS de navegador
        run: npm run typecheck:workers
      - name: Executar testes de regressÃ£o do aplicativo
        run: npm test
      - name: Verificar sessÃ£o pÃºblica e compilaÃ§Ã£o procedural
        run: |
          node --test src/routes/publicBlogger.contract.test.cjs
          node --test src/routes/dashboard_routes/compiler.procedural.test.js src/routes/dashboard_routes/compiler.procedural.integration.test.js
      - name: Validate authenticated artifact delivery before merge
        run: node --test scripts/deployBuildCache.contract.test.cjs scripts/deployFrontendGate.contract.test.cjs scripts/rsync-resume.contract.test.cjs scripts/artifactDelivery.test.cjs
      - name: Validar contratos Mercado Pago sem emitir cobranÃ§as
        run: node --test src/services/mercadoPagoBlogger.integration.test.cjs
      - name: Preparar assets locais
        run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar aplicação Angular canônica
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run typecheck
          npm --prefix frontend run test
          npm --prefix frontend run build
      # SAC tools are independently pinned and isolated from backend/VPS credentials.
      - uses: actions/checkout@v4
        with:
          repository: Softdown-prog/Data_libray
          ref: 97d5ae71844b56cfb073b5202c2f32398e9d532a
          path: .sac-tools
          persist-credentials: false
      - name: Instalar analisador SAC independente
        run: |
          npm ci --prefix .sac-tools/packages/angular-postcompiler --ignore-scripts --no-audit --no-fund
      - name: Auditar Angular real com SAC PRE002/PRE003/PRE004/PRE005/P001
        env:
          SAC_ANGULAR_BUILD_PASSED: 'true'
          SAC_REPORT_FILE: ${{ runner.temp }}/softload-sac-audit.json
        run: node scripts/sac-softload-audit.mjs
      - name: Verificar boot do aplicativo
        run: docker build --progress plain -t softload-blogger-ci .
      - name: Iniciar Docker e validar Angular, acesso protegido e XML sem credenciais
        run: bash scripts/smoke-container.sh softload-blogger-ci
      - name: Validar Angular em Chrome (desktop e celular emulado)
        run: |
          set -euo pipefail
          google-chrome --version
          cid="$(docker run -d --network bridge -p 127.0.0.1:18080:8080 \
            -e NODE_ENV=test -e SOFTLOAD_USE_ANGULAR=true \
            -e SESSION_SECRET=ci-session-not-for-production \
            -e FIREBASE_API_KEY=ci-only -e FIREBASE_APP_ID=ci-only \
            -e GOOGLE_CLOUD_PROJECT=blogger-ci \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:9 softload-blogger-ci)"
          trap 'docker rm -f "$cid" >/dev/null || true' EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/login >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          SAC_REPORT_FILE="${{ runner.temp }}/softload-sac-audit.json" \
            SOFTLOAD_BROWSER_URL=http://127.0.0.1:18080 npm --prefix frontend run test:e2e
      - name: Preservar relatório SAC para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softload-sac-report
          path: ${{ runner.temp }}/softload-sac-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Validar Compose App-only e a revisão configurável
        env:
          SOFTLOAD_IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f infra/compose.vps.yaml config --quiet
