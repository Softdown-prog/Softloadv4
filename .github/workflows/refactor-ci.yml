name: Softload Blogger - CI principal
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: TypeScript, Blogger, cobrança e Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps
      - name: Verificar contratos TypeScript e espelhos JS
        run: npm run typecheck
      - name: Verificar scripts JS de navegador
        run: npm run typecheck:workers
      - name: Executar testes de regressão do aplicativo
        run: npm test
      - name: Verificar sessão pública e compilação procedural
        run: |
          node --test src/routes/publicBlogger.contract.test.cjs
          node --test src/routes/dashboard_routes/compiler.procedural.test.js src/routes/dashboard_routes/compiler.procedural.integration.test.js
      - name: Validar contratos Mercado Pago sem emitir cobranças
        run: node --test src/services/mercadoPagoBlogger.integration.test.cjs
      - name: Preparar assets locais
        run: npm run build
      - name: Verificar boot do aplicativo
        run: docker build --progress plain -t softload-blogger-ci .
