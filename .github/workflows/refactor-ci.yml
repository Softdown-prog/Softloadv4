name: Softload - CI incremental TypeScript
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck + testes + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Diagnosticar API publica e Firestore na VPS (somente leitura)
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const url = 'https://softload.analysepro.com/health?ci_backend_diagnostic=1';
            const response = await fetch(url, {
              headers: {'Cache-Control': 'no-cache'},
              signal: AbortSignal.timeout(20000),
            });
            const body = await response.json();
            const sha = String(body?.deploy?.gitSha || 'ausente');
            const firestore = body?.firestore === true;
            const appStatus = String(body?.status || 'ausente');
            const line = 'HTTP ' + response.status + ', SHA ' + sha +
              ', app=' + appStatus + ', Firestore=' + (firestore ? 'OK' : 'FALHOU');
            console.log('[PROD-BACKEND] ' + line);
            if (!firestore || !response.ok) {
              console.log('::warning::Backend degradado: checar Firestore, credenciais da VPS e ID da base.');
            }
            const fs = require('node:fs');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n### Diagnostico backend publico (sem credenciais)\n' +
              '- ' + line + '\n');
          })().catch(error => {
            const description = String(error?.message || error).slice(0, 180);
            console.log('::warning::Consulta de saude publica falhou: ' + description);
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '\n### Diagnostico backend publico\n- Consulta indisponivel (sem alterar VPS)\n');
          });
          NODE
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps
      - name: Verificar contratos TypeScript
        run: npm run typecheck
      - name: Garantir contrato de duas imagens e Agent sem Chromium
        run: node --test scripts/deployBuildCache.contract.test.cjs scripts/removedServices.deploy.contract.test.cjs scripts/rsync-resume.contract.test.cjs
      - name: Contratos das rotas finais e RAG local (sem servicos externos)
        run: node --test src/routes/finalRoutes.contract.test.cjs src/solaris/rag/ragLocalSearch.test.js
      - name: Contratos de segurança do estágio GHCR privado
        run: node --test scripts/ghcr-release-contract.test.cjs
      - name: Python para ferramentas 2D
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências dos testes Forge
        run: |
          python -m pip install -r agent/forge/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Testar motor Blogger e servicos
        run: npm test
      - name: Validar Mercado Pago sem emitir cobranças
        run: node --test src/services/mercadoPagoBlogger.integration.test.cjs
      - name: Validar Blogger sem conta (cota, CSRF e XML)
        run: node --test src/routes/publicBlogger.contract.test.cjs
      - name: Conferir layout público EJS e navegação antes de mesclar
        run: npm run test:frontend-layouts
      - name: Build React
        run: npm run build
      - name: Verificar imagem Docker de producao
        run: docker build --progress plain -t softload-refactor-ci .

  agent:
    name: Worker Agent - testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Instalar dependencias Agent
        run: npm ci
      - name: Testar Agent
        run: npm test
