name: Softload - Qualidade XML Blogger
on:
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/blogger/**'
      - 'src/routes/dashboard_routes/compiler*'
      - '.github/workflows/template-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Compilar e validar a base e os 15 nichos reais
        run: npm run test:quality
