name: Reconcile Softload VPS

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-deploy.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: softload-vps-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare main with the public VPS and retry a missed deploy
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const expected = branch.data.commit.sha;
            let live = '';
            try {
              const response = await fetch(
                'https://softload.analysepro.com/health?reconcile=' + expected,
                { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000) }
              );
              if (response.ok) {
                const health = await response.json();
                if (health.status === 'ok') live = String(health.deploy?.gitSha || '');
              }
            } catch (error) {
              core.warning('Public health check failed: ' + error.message);
            }

            // Um App parado por scale-to-zero pode tornar /health inacessivel.
            // Nao converter indisponibilidade/503 em um novo deploy: isso cria
            // retries caros e nao conserta a rota de wake-up do proxy.
            if (!/^[a-f0-9]{7,40}$/.test(live)) {
              core.warning('Public /health unavailable or without valid SHA; skipping deployment retry. Verify Caddy wake routing and App container state separately.');
              return;
            }

            if (expected.startsWith(live)) {
              core.info('VPS is current: ' + expected);
              return;
            }

            const result = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy.yml', branch: 'main', per_page: 50
            });
            const runs = result.data.workflow_runs;
            if (runs.some(run => run.status !== 'completed')) {
              core.info('A deploy is already queued or running; next check will verify it.');
              return;
            }

            // Se o ultimo deploy falhou no contrato SSH do receptor instalado
            // na VPS, nao repetir o mesmo erro. A limpeza Docker nao atualiza
            // o forced-command: o administrador precisa migrar o receptor v2
            // antes de disparar o deploy manualmente.
            const lastFailed = runs.find(run =>
              run.head_sha === expected && run.conclusion === 'failure'
            );
            if (lastFailed) {
              const details = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: lastFailed.id, per_page: 100
              });
              const receiverBlocked = details.data.jobs.some(job =>
                job.name === 'plan' && (job.steps || []).some(step =>
                  step.name === 'Confirm receiver understands app+agent before upload' &&
                  step.conclusion === 'failure'
                )
              );
              if (receiverBlocked) {
                core.notice(
                  'Deploy parado com seguranca: o receptor SSH real da VPS ainda nao ' +
                  'aceita contract:v2 (app+agent). Nao adianta repetir Actions ou ' +
                  'limpar containers. Corrija o receptor no host e dispare ' +
                  'Deploy Softload VPS por workflow_dispatch. Ultimo erro: ' +
                  lastFailed.html_url
                );
                return;
              }
            }

            const retries = runs.filter(run =>
              run.head_sha === expected &&
              run.event === 'workflow_dispatch' &&
              run.conclusion === 'failure'
            ).length;
            if (retries >= 2) {
              core.setFailed('VPS differs from main after two automatic retries. Expected ' +
                expected + ', public ' + (live || 'unavailable'));
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'deploy.yml', ref: 'main'
            });
            core.warning('VPS differs from main. Started deploy retry ' +
              (retries + 1) + '/2 for ' + expected + '; public ' + (live || 'unavailable'));
