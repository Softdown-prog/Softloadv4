name: Deploy Softload VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/vps-artifact-transport-check.yml
  workflow_dispatch:

# Uma revisão por vez. Build no GitHub; artefato autenticado/criptografado
# por HTTPS para o runner sem Docker/sudo; SSH somente local para o receptor v2.
concurrency:
  group: softload-vps-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    # Testes antes de construir/publicar qualquer artefato de produção.
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - name: Gate frontend before building production images
        run: |
          npm run typecheck:frontend
          npm run test:frontend-base
          npm run test:frontend-layouts
      - name: Verify image metadata and deploy cache contracts
        run: node --test scripts/deployBuildCache.contract.test.cjs scripts/deployFrontendGate.contract.test.cjs scripts/removedServices.deploy.contract.test.cjs scripts/rsync-resume.contract.test.cjs scripts/artifactDelivery.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forge test dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install --retries 3 --timeout 30 -r agent/forge/requirements.txt
          # Os runners hospedados podem levar >15 minutos baixando ffmpeg
          # e suas dezenas de dependências do espelho Ubuntu. Durante o
          # teste, usamos binários Linux estáticos de versões FIXAS do npm.
          # Não são enviados para a VPS nem alteram o pacote de produção.
          media_dir="${RUNNER_TEMP}/forge-test-media"
          npm install --prefix "$media_dir" --no-save --ignore-scripts \
            --no-audit --no-fund --package-lock=false \
            @ffmpeg-installer/linux-x64@4.1.0 \
            @ffprobe-installer/linux-x64@5.2.0
          install -d "$media_dir/bin"
          ffmpeg_binary="$media_dir/node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
          ffprobe_binary="$media_dir/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          chmod +x "$ffmpeg_binary" "$ffprobe_binary"
          ln -s "$ffmpeg_binary" "$media_dir/bin/ffmpeg"
          ln -s "$ffprobe_binary" "$media_dir/bin/ffprobe"
          echo "$media_dir/bin" >> "$GITHUB_PATH"
          "$media_dir/bin/ffmpeg" -version >/dev/null
          "$media_dir/bin/ffprobe" -version >/dev/null
          "$media_dir/bin/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -F libvorbis
          # Pillow usa fontes do sistema; sinaliza caso o runner as perca.
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: npm test
      - name: Validar Blogger sem conta (cota, CSRF e XML)
        run: node --test src/routes/publicBlogger.contract.test.cjs
      - run: npm run test:quality
      - run: npm run build
      - name: Proibir referências ao ChatGPT no frontend e no bundle
        run: node scripts/check-frontend-branding.js

  plan:
    if: github.repository == 'Softdown-prog/Softloadv4' && github.ref == 'refs/heads/main'
    # Preflight rápido e sem efeitos colaterais: se a VPS rejeita contract:v2,
    # evita instalar dependências/testes pesados a cada push. A CI independente
    # Softload - Gate TypeScript continua verificando o frontend.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.latest.outputs.proceed }}
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record main revision without discarding the active deploy
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Main advanced to $latest; skip obsolete revision $GITHUB_SHA before running tests/build."
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure restricted SSH key
        if: steps.latest.outputs.proceed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SOFTLOAD_VPS_SSH_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/softload_deploy"
          chmod 600 "$HOME/.ssh/softload_deploy"
          printf '%s\n' '164.163.9.7 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGa3uqM1QMkr/Mhh7SNGs1jxUVg9x2HFVwJ2hJ1MIsfR' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      # Contrato somente-leitura: fail-closed antes de gerar/carregar imagens.
      # O receptor da VPS precisa ser migrado e retornar esta resposta exata.
      # O comando desconhecido no receptor antigo deve falhar sem efeitos.
      - name: Confirm receiver understands app+agent before upload
        if: steps.latest.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! contract="$(ssh -i "$HOME/.ssh/softload_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@164.163.9.7 'contract:v2')"; then
            echo "::error::Receptor VPS não implementa contract:v2; migre o receptor antes do deploy."
            exit 1
          fi
          if [[ "$contract" != 'softload-deploy:v2:app,agent' ]]; then
            echo "::error::Receptor VPS não confirmou contrato v2 app+agent; nenhuma imagem será transferida."
            exit 1
          fi
          echo '[DEPLOY] Receptor compatível com app+agent (v2).'
      - name: Compare with running revision
        if: steps.latest.outputs.proceed == 'true'
        id: diff
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if base="$(ssh -i "$HOME/.ssh/softload_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@164.163.9.7 current)"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --quiet "$base" "$TARGET_SHA" -- agent/ Power-up/; then echo 'agent=false' >> "$GITHUB_OUTPUT"; else echo 'agent=true' >> "$GITHUB_OUTPUT"; fi
          else
            # First deployment from Softloadv4: the running SHA belongs to the old repository.
            # Rebuild every service once, then compare commits normally on future deployments.
            echo 'agent=true' >> "$GITHUB_OUTPUT"
          fi
          echo "[DEPLOY] Running revision: $base"
  build_and_transfer:
    needs: [verify, plan]
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      # Limita o uso de disco/build; entrega externa acontece por HTTPS.
      max-parallel: 1
      matrix:
        include:
          - service: app
            context: .
            dockerfile: Dockerfile
          - service: agent
            context: agent
            dockerfile: agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Record main revision before build
        id: latest_before_build
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Main advanced to $latest; skip building obsolete revision $GITHUB_SHA."
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Determine whether this service changed
        if: steps.latest_before_build.outputs.proceed == 'true'
        id: changes
        env:
          AGENT_CHANGED: ${{ needs.plan.outputs.agent }}
        run: |
          case '${{ matrix.service }}' in
            app) changed=true ;;
            agent) changed="$AGENT_CHANGED" ;;
          esac
          [[ "$changed" == true || "$changed" == false ]]
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Prepare Agent native source
        if: steps.latest_before_build.outputs.proceed == 'true' && matrix.service == 'agent' && steps.changes.outputs.changed == 'true'
        run: node agent/scripts/vendorPowerUp.js
      # Compilacao acontece no GitHub-hosted runner, NAO na VPS e NAO
      # dentro da imagem do Worker. A imagem usa apenas ESM JavaScript.
      - name: Setup Node for Agent TypeScript compilation
        if: steps.latest_before_build.outputs.proceed == 'true' && matrix.service == 'agent' && steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate Agent runtime JavaScript from TypeScript
        if: steps.latest_before_build.outputs.proceed == 'true' && matrix.service == 'agent' && steps.changes.outputs.changed == 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Usa o lockfile da raiz. O codigo TS do Agent requer apenas
          # TypeScript e acorn; ignora postinstall durante essa etapa.
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run typecheck:agent
          npm run build:agent:capabilities
      # Cache de camadas dos serviços app/agent nos runners hospedados.
      # Importante: o cache acelera build/npm/apt/Chromium no GitHub,
      # mas não reduz sozinho o .tar.gz enviado à VPS.
      - name: Prepare shared Docker BuildKit cache
        if: steps.latest_before_build.outputs.proceed == 'true' && steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build versioned image with cached layers
        if: steps.latest_before_build.outputs.proceed == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          extra_args=()
          if [[ '${{ matrix.service }}' == app ]]; then
            # O app expõe esses arquivos em /health; nunca reciclar um SHA
            # anterior em um deploy novo.
            commit_date="$(git show -s --format=%cI "$GITHUB_SHA")"
            extra_args+=(--build-arg "GIT_SHA=$GITHUB_SHA" --build-arg "GIT_DATE=$commit_date")
          fi
          docker buildx build --load \
            --cache-from 'type=gha,scope=softload-${{ matrix.service }}' \
            --cache-to 'type=gha,scope=softload-${{ matrix.service }},mode=max,ignore-error=true' \
            "${extra_args[@]}" \
            -t 'softload-${{ matrix.service }}:${{ github.sha }}' \
            -f '${{ matrix.dockerfile }}' '${{ matrix.context }}'
      - name: Verify app release metadata without network
        if: steps.latest_before_build.outputs.proceed == 'true' && matrix.service == 'app' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="softload-app:${GITHUB_SHA}"
          actual="$(docker run --rm --entrypoint cat "$image" /usr/src/app/GIT_SHA)"
          test "$actual" = "$GITHUB_SHA"
          docker run --rm --entrypoint sh "$image" -c 'test ! -d /usr/src/app/.git'
          echo "[BUILD] Commit SHA verified; .git absent from production container"

      # Medição real da imagem Docker (não confundir com bytes versionados no Git).
      - name: Report Docker image size
        if: steps.latest_before_build.outputs.proceed == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="softload-${{ matrix.service }}:${{ github.sha }}"
          bytes="$(docker image inspect --format='{{.Size}}' "$image")"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
          echo "[IMAGE] ${{ matrix.service }}: $bytes bytes ($mib MiB)"
          {
            echo "### Imagem Docker: ${{ matrix.service }}"
            echo "Tamanho local: **$mib MiB** ($bytes bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record main revision before transfer
        if: steps.latest_before_build.outputs.proceed == 'true'
        id: latest_before_transfer
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Main advanced to $latest; do not upload obsolete revision $GITHUB_SHA."
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Encrypt and authenticate image for HTTPS delivery
        if: steps.latest_before_transfer.outputs.proceed == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SOFTLOAD_VPS_SSH_KEY }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          umask 077
          dir="$RUNNER_TEMP/release"
          install -m 700 -d "$dir"
          archive="$RUNNER_TEMP/softload-${{ matrix.service }}-${{ github.sha }}.tar.gz"
          trap 'rm -f "$archive"' EXIT
          docker save 'softload-${{ matrix.service }}:${{ github.sha }}' | gzip -1 > "$archive"
          export ARTIFACT_PASSWORD="softload-artifact-v1:$DEPLOY_KEY"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:ARTIFACT_PASSWORD -in "$archive" -out "$dir/image.enc"
          # Encrypt-then-MAC, key/domain separated from encryption. Bind to
          # this repository, run, revision and service; never publish plaintext.
          python3 - "$dir" <<'PYMAC'
          import hashlib, hmac, os, pathlib, sys
          folder = pathlib.Path(sys.argv[1])
          key = hashlib.sha256(b'softload-artifact-mac-v1\0' + os.environ['DEPLOY_KEY'].encode()).digest()
          context = '/'.join(os.environ[k] for k in ('GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_SHA', 'SERVICE'))
          mac = hmac.new(key, context.encode() + b'\0', hashlib.sha256)
          with (folder / 'image.enc').open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  mac.update(chunk)
          (folder / 'image.mac').write_text(mac.hexdigest() + '\n')
          PYMAC
          echo "[DELIVERY] $SERVICE encrypted bytes: $(stat -c '%s' "$dir/image.enc")"
      - name: Upload encrypted image only
        if: steps.latest_before_transfer.outputs.proceed == 'true' && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: softload-${{ matrix.service }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/image.enc
            ${{ runner.temp }}/release/image.mac
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Clean builder release material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release"

  receive:
    needs: [plan, build_and_transfer]
    if: needs.plan.outputs.proceed == 'true' && github.repository == 'Softdown-prog/Softloadv4' && github.ref == 'refs/heads/main'
    # No checkout, npm, application code, Docker socket or sudo on the host.
    # Only authenticated encrypted bytes and the existing restricted receiver.
    runs-on: [self-hosted, Linux, X64, softload-vps-deploy]
    timeout-minutes: 60
    steps:
      - name: Check isolated VPS runner and prepare local receiver
        id: local
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.SOFTLOAD_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$(id -un)" = softloadrunner
          ! id -nG | tr ' ' '\n' | grep -qx docker
          ! sudo -n true >/dev/null 2>&1
          for tool in openssl python3 rsync ssh curl; do command -v "$tool" >/dev/null; done
          # Do not silently fall back to the slow public network SSH upload.
          ip route get 164.163.9.7 | grep -q '^local '
          available="$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          test "$available" -ge 3221225472 || { echo '::error::Need 3 GiB free for encrypted delivery and Docker staging.'; exit 1; }
          latest="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Main advanced; do not upload obsolete revision $GITHUB_SHA."
            exit 0
          fi
          test -n "$DEPLOY_KEY"
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/softload-delivery.XXXXXX")"
          echo "DELIVERY_DIR=$dir" >> "$GITHUB_ENV"
          printf '%s\n' "$DEPLOY_KEY" > "$dir/key"
          printf '%s\n' '164.163.9.7 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGa3uqM1QMkr/Mhh7SNGs1jxUVg9x2HFVwJ2hJ1MIsfR' > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          contract="$(ssh -i "$dir/key" -o UserKnownHostsFile="$dir/known_hosts" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 root@164.163.9.7 'contract:v2')"
          test "$contract" = 'softload-deploy:v2:app,agent'
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - name: Download encrypted images through parallel HTTPS ranges
        if: steps.local.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_CHANGED: ${{ needs.plan.outputs.agent }}
        run: |
          set -euo pipefail
          for service in app agent; do
            if [ "$service" = agent ] && [ "$AGENT_CHANGED" = false ]; then continue; fi
            export ARTIFACT_NAME="softload-$service-$GITHUB_SHA"
            export OUTPUT_DIR="$DELIVERY_DIR/$service"
            python3 - <<'PYHTTPS'
          """Download one same-run encrypted artifact with bounded parallel HTTPS ranges.

          Embedded verbatim in the workflow: the VPS runner never checks out repository code.
          Only the two expected non-executable files are extracted. Never log signed URLs.
          """
          import concurrent.futures
          import json
          import math
          import os
          from pathlib import Path
          import shutil
          import tempfile
          import time
          import urllib.error
          import urllib.request
          import zipfile


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def api_request(path):
              return urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})


          def signed_artifact_url(artifact_id):
              # Do not forward the API Authorization header to the blob host.
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(api_request('/actions/artifacts/' + str(artifact_id) + '/zip'), timeout=30):
                      raise RuntimeError('Expected artifact redirect')
              except urllib.error.HTTPError as error:
                  if error.code != 302:
                      raise RuntimeError('Artifact redirect HTTP ' + str(error.code)) from None
                  url = error.headers.get('Location', '')
                  if not url.startswith('https://'):
                      raise RuntimeError('Invalid artifact redirect')
                  return url


          def download_range(url, target, start, end, total, refresh_url=None):
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url, headers={'Range': f'bytes={start}-{end}'})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          expected = f'bytes {start}-{end}/{total}'
                          if response.status != 206 or response.headers.get('Content-Range') != expected:
                              raise RuntimeError('Server did not honor bounded HTTP range')
                          remaining = end - start + 1
                          with target.open('wb') as output:
                              while remaining:
                                  chunk = response.read(min(1024 * 1024, remaining))
                                  if not chunk:
                                      raise RuntimeError('Incomplete artifact range')
                                  output.write(chunk)
                                  remaining -= len(chunk)
                      return target
                  except (OSError, RuntimeError, urllib.error.URLError):
                      target.unlink(missing_ok=True)
                      if attempt == 3:
                          # urllib exceptions may include a signed URL. Do not print them.
                          raise RuntimeError('Artifact range failed after four attempts') from None
                      time.sleep(attempt + 1)
                      if refresh_url is not None:
                          url = refresh_url()


          def receive(url, folder, refresh_url=None):
              with urllib.request.urlopen(urllib.request.Request(url, method='HEAD'), timeout=30) as response:
                  total = int(response.headers.get('Content-Length', '0'))
              if not 0 < total <= 8 * 1024**3:
                  raise RuntimeError('Unexpected artifact size')
              folder.mkdir(mode=0o700, parents=True, exist_ok=True)
              with tempfile.TemporaryDirectory(prefix='ranges-', dir=folder) as temporary:
                  scratch = Path(temporary)
                  chunk_size = max(512 * 1024, min(8 * 1024**2, math.ceil(total / 12)))
                  ranges = [(start, min(start + chunk_size, total) - 1) for start in range(0, total, chunk_size)]
                  started = time.monotonic()
                  with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
                      tasks = [pool.submit(download_range, url, scratch / str(i), start, end, total, refresh_url)
                               for i, (start, end) in enumerate(ranges)]
                      for completed, task in enumerate(concurrent.futures.as_completed(tasks), 1):
                          task.result()
                          print(f'[HTTPS] Range {completed}/{len(tasks)} received', flush=True)
                  archive = scratch / 'artifact.zip'
                  with archive.open('wb') as output:
                      for i in range(len(ranges)):
                          with (scratch / str(i)).open('rb') as source:
                              shutil.copyfileobj(source, output)
                          (scratch / str(i)).unlink()
                  with zipfile.ZipFile(archive) as zipped:
                      if sorted(zipped.namelist()) != ['image.enc', 'image.mac']:
                          raise RuntimeError('Unexpected artifact entries')
                      for name in ('image.enc', 'image.mac'):
                          info = zipped.getinfo(name)
                          if info.file_size > total or (name == 'image.mac' and info.file_size > 128):
                              raise RuntimeError('Unexpected artifact member size')
                          with zipped.open(name) as source, (folder / name).open('wb') as output:
                              shutil.copyfileobj(source, output)
                  elapsed = max(time.monotonic() - started, 0.001)
                  print(f'[HTTPS] {total} encrypted bytes in {elapsed:.1f}s ({total / elapsed / 1024**2:.2f} MiB/s)', flush=True)


          def main():
              request = api_request('/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100')
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              matches = [a for a in data['artifacts']
                         if a['name'] == os.environ['ARTIFACT_NAME'] and not a['expired']]
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly one same-run artifact')
              artifact = matches[0]
              run = artifact.get('workflow_run', {})
              if run.get('head_sha') != os.environ['GITHUB_SHA']:
                  raise RuntimeError('Artifact revision differs from workflow revision')
              refresh = lambda: signed_artifact_url(artifact['id'])
              receive(refresh(), Path(os.environ['OUTPUT_DIR']), refresh)


          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  raise SystemExit('HTTPS artifact delivery failed; no activation. Check range/download step.') from None
          PYHTTPS
          done
      - name: Authenticate encrypted artifacts before decryption
        if: steps.local.outputs.proceed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SOFTLOAD_VPS_SSH_KEY }}
          AGENT_CHANGED: ${{ needs.plan.outputs.agent }}
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          import hashlib, hmac, os, pathlib
          key = hashlib.sha256(b'softload-artifact-mac-v1\0' + os.environ['DEPLOY_KEY'].encode()).digest()
          services = ['app', 'agent'] if os.environ['AGENT_CHANGED'] == 'true' else ['app']
          for service in services:
              folder = pathlib.Path(os.environ['DELIVERY_DIR']) / service
              context = '/'.join([os.environ[k] for k in ('GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_SHA')] + [service])
              mac = hmac.new(key, context.encode() + b'\0', hashlib.sha256)
              with (folder / 'image.enc').open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      mac.update(chunk)
              expected = (folder / 'image.mac').read_text().strip()
              if not hmac.compare_digest(mac.hexdigest(), expected):
                  raise SystemExit('Artifact authentication failed: ' + service)
              print('[DELIVERY] Authenticated', service)
          PYVERIFY
      - name: Load both images through local restricted SSH
        if: steps.local.outputs.proceed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SOFTLOAD_VPS_SSH_KEY }}
          AGENT_CHANGED: ${{ needs.plan.outputs.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export ARTIFACT_PASSWORD="softload-artifact-v1:$DEPLOY_KEY"
          ssh_options=(-i "$DELIVERY_DIR/key" -o UserKnownHostsFile="$DELIVERY_DIR/known_hosts"
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          for service in app agent; do
            latest="$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
            if [ "$latest" != "$GITHUB_SHA" ]; then
              echo "::notice::Main advanced; stop retries for obsolete image $GITHUB_SHA."
              exit 0
            fi
            if [ "$service" = agent ] && [ "$AGENT_CHANGED" = false ]; then
              ssh "${ssh_options[@]}" root@164.163.9.7 "reuse:$service:$GITHUB_SHA"
              continue
            fi
            archive="$DELIVERY_DIR/softload-$service-$GITHUB_SHA.tar.gz"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:ARTIFACT_PASSWORD -in "$DELIVERY_DIR/$service/image.enc" -out "$archive"
            digest="$(sha256sum "$archive" | cut -d' ' -f1)"
            # Local kernel route confirmed above; no WAN upload here.
            # Checksum/inplace repairs a stale same-size staged file too.
            printf -v remote_shell '%q ' ssh "${ssh_options[@]}"
            timeout --signal=TERM --kill-after=10s 300s \
              rsync --checksum --inplace --partial --timeout=90 --no-compress --stats \
              -e "$remote_shell" "$archive" "root@164.163.9.7:softload-$service-$GITHUB_SHA.tar.gz"
            timeout --signal=TERM --kill-after=10s 300s \
              ssh "${ssh_options[@]}" root@164.163.9.7 "finish:$service:$GITHUB_SHA:$digest"
            rm -f "$archive" "$DELIVERY_DIR/$service/image.enc"
          done
      - name: Remove decrypted images and temporary credentials
        if: always()
        shell: bash
        run: |
          if [[ "${DELIVERY_DIR:-}" == "$RUNNER_TEMP"/softload-delivery.* ]]; then
            rm -rf -- "$DELIVERY_DIR"
          fi

  activate:
    needs: receive
    # Ativação pelo receptor existente, depois das duas imagens carregadas.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record main revision before activation
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]]
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Main advanced to $latest; skip activating obsolete revision $GITHUB_SHA."
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.proceed == 'true'
        with:
          node-version: '22'
      - name: Configure restricted SSH key
        if: steps.latest.outputs.proceed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.SOFTLOAD_VPS_SSH_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -m 700 -d "$RUNNER_TEMP/softload-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/softload-ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/softload-ssh/deploy_key"
          printf '%s\n' '164.163.9.7 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGa3uqM1QMkr/Mhh7SNGs1jxUVg9x2HFVwJ2hJ1MIsfR' > "$RUNNER_TEMP/softload-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/softload-ssh/known_hosts"
      - name: Reconfirm receiver v2 immediately before activating
        if: steps.latest.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! contract="$(ssh -i "$RUNNER_TEMP/softload-ssh/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/softload-ssh/known_hosts" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 root@164.163.9.7 'contract:v2')"; then
            echo "::error::Receptor VPS indisponível/incompatível antes da ativação."
            exit 1
          fi
          if [[ "$contract" != 'softload-deploy:v2:app,agent' ]]; then
            echo "::error::Contrato v2 divergente; ativação cancelada sem trocar containers."
            exit 1
          fi
      - name: Activate only after every image arrives
        if: steps.latest.outputs.proceed == 'true'
        run: ssh -i "$RUNNER_TEMP/softload-ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/softload-ssh/known_hosts" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@164.163.9.7 'deploy:${{ github.sha }}'

      # The SSH command can succeed while the public site still serves a
      # previous image. Verify the commit from the application's own /health.
      - name: Confirm public VPS is serving this commit
        if: steps.latest.outputs.proceed == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            echo "[DEPLOY] Public revision check ($attempt/15)"
            if curl --fail --silent --show-error --max-time 15 \
                -H 'Cache-Control: no-cache' \
                "https://softload.analysepro.com/health?deploy_sha=${EXPECTED_SHA}" \
                | node -e '
                  let raw = "";
                  process.stdin.setEncoding("utf8");
                  process.stdin.on("data", chunk => raw += chunk);
                  process.stdin.on("end", () => {
                    try {
                      const payload = JSON.parse(raw);
                      const live = String(payload?.deploy?.gitSha || "");
                      const expected = process.env.EXPECTED_SHA;
                      if (payload.status === "ok" && /^[a-f0-9]{40}$/.test(live) && expected === live) {
                        console.log("[DEPLOY] Confirmed live git SHA:", live);
                        return;
                      }
                      console.error("[DEPLOY] SHA mismatch: expected", expected.slice(0, 12), "got", live || "(missing)");
                    } catch (error) {
                      console.error("[DEPLOY] Invalid /health response:", error.message);
                    }
                    process.exitCode = 1;
                  });
                '; then
              exit 0
            fi
            if [ "$attempt" -lt 15 ]; then sleep 6; fi
          done
          echo "::error::VPS public /health did not report commit ${EXPECTED_SHA} after activation"
          exit 1

      # Produto comercial agora é Blogger EJS. O deploy deve conferir a
      # landing e o editor anônimo ao vivo, não o React legado.
      - name: Confirm public Blogger landing and guest editor are live
        if: steps.latest.outputs.proceed == 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for page in landing criar; do
            url="https://softload.analysepro.com/"
            if [ "$page" = criar ]; then url="https://softload.analysepro.com/criar"; fi
            curl --fail --silent --show-error --compressed \
              --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "$url?deploy_sha=${EXPECTED_SHA}&audit=blogger" \
              -o "$RUNNER_TEMP/softload-${page}.html"
          done
          node - "$RUNNER_TEMP/softload-landing.html" "$RUNNER_TEMP/softload-criar.html" <<'NODE'
          const fs = require('node:fs');
          const landing = fs.readFileSync(process.argv[2], 'utf8');
          const editor = fs.readFileSync(process.argv[3], 'utf8');
          if (!landing.includes('Experimentar gratuitamente') || !landing.includes('href="/criar"') ||
              !editor.includes('id="generator-form"') || !editor.includes('action="/criar/download"') ||
              !editor.includes('name="guestToken"')) {
            console.error('[DEPLOY] Blogger público não está íntegro; verifique landing e editor.');
            process.exit(1);
          }
          if (/A7 Forge|href="\/dashboard\/forge-2d"|\/dist\/assets\/main\.js/.test(landing+editor)) {
            console.error('[DEPLOY] Artefatos da oferta antiga ainda aparecem nas páginas públicas.');
            process.exit(1);
          }
          console.log('[DEPLOY] Landing Blogger e editor público verificados no domínio.');
          NODE
      - name: Remove temporary deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/softload-ssh/deploy_key" "$RUNNER_TEMP/softload-ssh/known_hosts"
