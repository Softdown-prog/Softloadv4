name: Test VPS receiver migration (offline)

on:
  push:
    branches: [main]
    paths:
      - scripts/vps/cleanup_staging.py
      - scripts/vps/test_cleanup_staging.py
      - scripts/vps/softload-actions-receiver.sh
      - scripts/vps/softload-clean-stale-archives.sh
      - scripts/vps/test_receiver_retention.py
      - .github/workflows/test-receiver-migration.yml
  pull_request:
    paths:
      - scripts/vps/cleanup_staging.py
      - scripts/vps/test_cleanup_staging.py
      - scripts/vps/softload-actions-receiver.sh
      - scripts/vps/softload-clean-stale-archives.sh
      - scripts/vps/test_receiver_retention.py
      - .github/workflows/test-receiver-migration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate receiver migration and safe staging cleanup offline
        run: |
          python3 -m unittest discover -s scripts/vps -p test_cleanup_staging.py -v
          python3 -m unittest discover -s scripts/vps -p test_receiver_retention.py -v
          bash -n scripts/vps/softload-actions-receiver.sh scripts/vps/softload-clean-stale-archives.sh
