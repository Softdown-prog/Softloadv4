name: One-time Angular lockfile import (PR 132)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  commit-generated-lockfile:
    if: >-
      github.repository == 'Softdown-prog/Softloadv4' &&
      github.event.pull_request.number == 132 &&
      github.head_ref == 'test/softload-sac-angular-audit-20261105' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/softload-sac-angular-audit-20261105
          persist-credentials: true
      - name: Import exact lockfile already produced by green CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          gh run download 42154443219 --repo "$GITHUB_REPOSITORY" --name softload-angular-lockfile --dir "$temp"
          test -s "$temp/package-lock.json"
          echo 'e057cfa8cff65c8c325685509c6eb21d1d818c0bd186e1c1fca63a9997718eff  '"$temp/package-lock.json" | sha256sum -c -
          python3 - "$temp/package-lock.json" <<'PY'
          import json,sys
          manifest=json.load(open('frontend/package.json',encoding='utf-8'))
          lock=json.load(open(sys.argv[1],encoding='utf-8'))
          assert lock['lockfileVersion']==3
          assert lock['name']==manifest['name']
          assert lock['packages']['']['dependencies']==manifest['dependencies']
          assert lock['packages']['']['devDependencies']==manifest['devDependencies']
          assert lock['packages']['node_modules/electron-to-chromium']['version']=='1.5.467'
          assert lock['packages']['node_modules/electron-to-chromium']['integrity'].startswith('sha512-')
          PY
          cp "$temp/package-lock.json" frontend/package-lock.json
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Angular lockfile is already versioned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(angular): version tested npm lockfile from green CI'
          git push origin HEAD:refs/heads/test/softload-sac-angular-audit-20261105
