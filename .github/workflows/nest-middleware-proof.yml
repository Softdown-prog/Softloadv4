name: Softload - NestJS middleware proof (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'nest-middleware/**'
      - 'server.ts'
      - 'server.js'
      - 'src/routes/authRoutes.ts'
      - 'src/routes/authRoutes.js'
      - 'src/routes/authRoutes.test.js'
      - 'src/middlewares/authGuard.ts'
      - 'src/middlewares/authGuard.js'
      - 'src/middlewares/authGuard.test.js'
      - '.github/workflows/nest-middleware-proof.yml'
  pull_request:
    paths:
      - 'nest-middleware/**'
      - 'src/middlewares/accessPolicy.ts'
      - 'src/middlewares/accessPolicy.js'
      - 'src/middlewares/accessPolicy.test.js'
      - 'src/middlewares/authGuard.ts'
      - 'src/middlewares/authGuard.js'
      - 'src/middlewares/authGuard.test.js'
      - '.github/workflows/nest-middleware-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  middleware:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Legacy-independent access policy regressions
        run: node --test src/middlewares/accessPolicy.test.js
      - name: Legacy logout error contract
        run: node --test src/routes/authRoutes.test.js
      - name: Real premium renewal and expiry guard
        run: node --test src/middlewares/authGuard.test.js
      # The session parity proof imports the EXACT production Express 4 and
      # express-session versions from the root lockfile. Install production
      # dependencies without lifecycle scripts, Firebase calls or secrets.
      - name: Install pinned legacy HTTP/session dependencies for offline parity
        run: npm ci --omit=dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      # Isolated pilot: use the reviewed lockfile, never install unlocked
      # transitive dependencies. Does not change the production image.
      - name: Install reproducible Nest 12 dependencies
        run: npm ci --prefix nest-middleware --ignore-scripts --no-audit --no-fund
      - name: Compile isolated Nest TypeScript sources
        run: npm --prefix nest-middleware run build
      - name: Prove real Nest DI and HTTP guard behavior
        run: npm --prefix nest-middleware test

