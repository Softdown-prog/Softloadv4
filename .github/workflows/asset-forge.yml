name: Solaris Asset Forge
on:
  push:
    branches: [main]
    paths: ['agent/**', 'src/solaris/**', 'src/routes/dashboard_routes/solaris.js', 'Dockerfile', '.github/workflows/asset-forge.yml']
  pull_request:
    paths: ['agent/**', 'src/solaris/**', 'src/routes/dashboard_routes/solaris.js', 'Dockerfile', '.github/workflows/asset-forge.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r agent/forge/requirements.txt pytest
          npm ci --legacy-peer-deps
          npm ci --prefix agent
      - name: Verify imported tools and render real assets
        run: |
          node agent/forge/verify-source.cjs
          node agent/forge/smoke.cjs
          node --test agent/forge/test/runtime.test.cjs
      - name: Original A7 renderer regressions
        working-directory: agent/forge
        env:
          PYTHONPATH: tools/visitor_forge_2d/src
        run: python -m pytest -q tools/visitor_forge_2d/tests
      - name: Solaris integration regressions
        run: |
          node src/solaris/tools/assetForge.test.js
          node src/solaris/tools/projectStorage.binary.test.js
          node src/solaris/tools/fileTools.test.js
          node src/solaris/chat/solarisChat.test.js
          node src/solaris/manifest/manifestSchema.test.js
          node src/solaris/pipeline/orchestrator.test.js
          node src/solaris/pipeline/projectEditor.test.js
      - name: Worker Agent regressions
        run: npm test --prefix agent
      - name: Build production Worker Agent image (includes Forge smoke)
        run: |
          npm run vendor:power-up --prefix agent
          docker build -t softload-agent-forge:test agent
