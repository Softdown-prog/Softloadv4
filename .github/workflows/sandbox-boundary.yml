name: Solaris Sandbox - fronteiras e perfil leve

on:
  push:
    branches: [main]
    paths:
      - 'agent/src/config/sandbox-endpoints*'
      - 'agent/src/capabilities/archive*'
      - 'agent/src/capabilities/web-sandbox*'
      - 'sandbox-efemoro/**'
      - '.github/workflows/sandbox-boundary.yml'
  pull_request:
    paths:
      - 'agent/src/config/sandbox-endpoints*'
      - 'agent/src/capabilities/archive*'
      - 'agent/src/capabilities/web-sandbox*'
      - 'sandbox-efemoro/**'
      - '.github/workflows/sandbox-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - name: Verificar roteamento e compatibilidade
        run: node --test src/config/sandbox-endpoints.test.js src/capabilities/archive.test.js src/capabilities/web-sandbox.test.js

  archive-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sandbox-efemoro/package-lock.json
      - name: Instalar JS sem browsers
        working-directory: sandbox-efemoro
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: Validar modos de serviço
        working-directory: sandbox-efemoro
        run: node --test src/serviceMode.test.js
      - name: Construir imagem dedicada slim, sem Chromium
        run: docker build --progress plain -t softload-sandbox:archive-slim -f sandbox-efemoro/Dockerfile.archive sandbox-efemoro
      - name: Smoke real de HTTP, segredo, ZIP e browser bloqueado
        run: bash sandbox-efemoro/scripts/smoke-archive-slim.sh
      - name: Validar Compose independente sem acesso a VPS
        env:
          SOFTLOAD_DOCKER_NETWORK: ci-internal
          SANDBOX_ARCHIVE_SHARED_SECRET: ci-secret-not-for-production
        run: docker compose -f sandbox-efemoro/compose.archive.yml config --quiet
      - name: Medir imagem archive-slim
        run: |
          set -euo pipefail
          bytes="$(docker image inspect --format='{{.Size}}' softload-sandbox:archive-slim)"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
          echo "[IMAGE] archive-slim: $bytes bytes ($mib MiB)"
          echo "Sandbox archive-slim: **$mib MiB** ($bytes bytes)" >> "$GITHUB_STEP_SUMMARY"

  # Teste da imagem de auditoria web apenas em PR/dispatch. Em push na
  # main, o deploy já constrói esta imagem e roda o smoke do Dockerfile.
  browser-headless-shell:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem com apenas Chromium Headless Shell
        run: docker build --progress plain -t softload-sandbox:headless-shell -f sandbox-efemoro/Dockerfile sandbox-efemoro
      - name: Medir imagem headless-shell
        shell: bash
        run: |
          set -euo pipefail
          bytes="$(docker image inspect --format='{{.Size}}' softload-sandbox:headless-shell)"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
          echo "[IMAGE] headless-shell: $bytes bytes ($mib MiB)"
          echo "Sandbox Headless Shell: **$mib MiB** ($bytes bytes)" >> "$GITHUB_STEP_SUMMARY"
