name: Softload Blogger - Gate de produÃ§Ã£o
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.ejs'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/softload-typescript-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blogger:
    name: Tipos, testes e compilador Blogger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run typecheck:workers
      - run: npm test
      - run: node --test src/routes/publicBlogger.contract.test.cjs src/services/mercadoPagoBlogger.integration.test.cjs
      - run: npm run build
      - run: docker build --progress plain -t softload-blogger-gate .
      - run: bash scripts/smoke-container.sh softload-blogger-gate
