name: Softload - Gate TypeScript

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.js'
      - 'src/solaris/code-examples/**'
      - 'examples/solaris-code/**'
      - 'scripts/codeCorpus/**'
      - 'scripts/audit-template-fidelity.ts'
      - 'scripts/audit-template-fidelity.js'
      - 'scripts/audit-template-fidelity.contract.test.js'
      - 'scripts/visual/renderPreview.ts'
      - 'scripts/visual/compareTemplates.ts'
      - 'scripts/visual/compareTemplates.js'
      - 'scripts/visual/compareTemplates.test.js'
      - 'scripts/visual/renderPreview.js'
      - 'scripts/visual/renderPreview.test.js'
      - 'scripts/ragCodeIndex.js'
      - 'scripts/ragCodeIndex.ts'
      - 'scripts/ragCodeIndexMigration.test.js'
      - 'scripts/ragEmbedIndex.ts'
      - 'scripts/ragEmbedIndex.js'
      - 'scripts/ragEmbedIndex.test.js'
      - 'scripts/ragGenerate.ts'
      - 'scripts/ragGenerate.js'
      - 'scripts/ragGenerate.test.js'
      - 'scripts/solarisProjectLockRecovery.ts'
      - 'scripts/solarisProjectLockRecovery.js'
      - 'scripts/solarisProjectLockRecovery.test.js'
      - 'scripts/setupAdmin.ts'
      - 'scripts/setupAdmin.js'
      - 'scripts/setupAdmin.test.js'
      - 'scripts/generateRagBalcao.ts'
      - 'scripts/generateRagBalcao.js'
      - 'scripts/generateRagBalcao.test.js'
      - 'scripts/gerar-blocos-rag.ts'
      - 'scripts/gerar-blocos-rag.js'
      - 'scripts/gerar-blocos-rag.test.js'
      - 'scripts/generateBlocks.ts'
      - 'scripts/appendBlocks.ts'
      - 'scripts/appendBlocks.js'
      - 'scripts/appendBlocks.test.js'
      - 'scripts/fixImplCssVars.ts'
      - 'scripts/fixImplCssVars.js'
      - 'scripts/fixImplCssVars.test.js'
      - 'scripts/generateBlocks.js'
      - 'scripts/generateBlocks.test.js'
      - 'scripts/ragCodeCollect.ts'
      - 'scripts/ragCodeCollect.js'
      - 'scripts/ragOrganizarRascunhos.ts'
      - 'scripts/ragOrganizarRascunhos.js'
      - 'scripts/ragOrganizarRascunhos.test.js'
      - 'tsconfig.json'
      - 'tsconfig.frontend.json'
      - 'frontend/**'
      - 'vite.config.js'
      - 'scripts/typescript-mirror-sources.json'
      - 'scripts/check-typescript-mirrors.js'
      - 'scripts/check-typescript-mirrors.ts'
      - 'scripts/check-typescript-mirrors.test.js'
      - 'scripts/audit-typescript-migration.js'
      - 'scripts/vendorAssets.ts'
      - 'scripts/vendorAssets.js'
      - 'scripts/vendorTemplateRefs.ts'
      - 'scripts/vendorTemplateRefs.js'
      - 'scripts/vendorCachePolicy.ts'
      - 'scripts/vendorCachePolicy.js'
      - 'scripts/check-frontend-branding.ts'
      - 'scripts/check-frontend-branding.js'
      - 'scripts/compile-batch.ts'
      - 'scripts/compile-batch.js'
      - 'scripts/extractTemplate.ts'
      - 'scripts/extractTemplate.js'
      - 'scripts/runTests.ts'
      - 'scripts/runTests.js'
      - 'scripts/audit-typescript-migration.ts'
      - 'server.js'
      - 'views/**/*.ejs'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/softload-typescript-gate.yml'

permissions:
  contents: read

jobs:
  typecheck:
    name: Contratos e espelhos TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps
      - name: Verificar integridade dos assets vendor
        run: npm run verify:vendor
      - name: Conferir links vendor dos templates EJS
        run: npm run verify:vendor:templates
      - name: Verificar biblioteca autoral Solaris Code
        run: npm run rag:code-test
      - name: Simular indexação do corpus de código (sem Firestore)
        run: npm run rag:code-index -- --limit=3
      - name: Validar contratos tipados dos namespaces RAG
        run: node --test src/knowledge/ragNamespacesContract.test.js
      - name: Verificar isolamento dos três RAGs
        run: npm run rag:boundaries-test
      - name: Testar scripts CLI migrados sem Firestore real
        run: npm run test:typescript-clis
      - name: Verificar organização de rascunhos RAG (dados temporários)
        run: node scripts/ragOrganizarRascunhos.test.js
      - name: Comparar templates com navegador simulado
        run: node --test scripts/visual/compareTemplates.test.js
      - name: Testar preview visual com navegador simulado
        run: node scripts/visual/renderPreview.test.js
      - name: Verificar gerador de catálogo Solaris RAG (modelo falso e pasta temporária)
        run: node scripts/ragGenerate.test.js
      - name: Verificar Firestore em memória (sem conexão remota)
        run: node --test src/solaris/rag/ragVectorStore.test.js
      - name: Testar CLI de recuperação de bloqueios com dependências simuladas
        run: node --test scripts/solarisProjectLockRecovery.test.js
      - name: Testar utilitário de administrador sem acesso ao Firestore real
        run: node --test scripts/setupAdmin.test.js
      - name: Testar gerador Blogger Balcão sem chamadas ao Gemini
        run: node --test scripts/generateRagBalcao.test.js
      - name: Testar geração Blogger UI sem créditos de API
        run: node --test scripts/gerar-blocos-rag.test.js
      - name: Contratos de fidelidade estrutural Blogger (sem navegador)
        run: node --test scripts/audit-template-fidelity.contract.test.js
      - name: Testar gerador de temas Blogger com Gemini simulado
        run: node --test scripts/generateBlocks.test.js
      - name: Testar appender de blocos sem consumo de API Gemini
        run: node --test scripts/appendBlocks.test.js
      - name: Testar atualizador CSS Vars sem Gemini real
        run: node --test scripts/fixImplCssVars.test.js
      - name: Testar autoauditoria de espelhos TypeScript (arquivos temporários)
        run: node --test scripts/check-typescript-mirrors.test.js
      - name: Testar contratos da base React em ambientes simulados
        run: npm run test:frontend-base
      - name: Conferir rotas e layouts React migrados
        run: npm run test:frontend-layouts
      - name: Testar prévia isolada de créditos V2 do dashboard
        run: node --test frontend/tests/creditsV2.test.cjs
      - name: Validar layout e rolagem dos chats React
        run: node --test frontend/tests/conversation-ui.test.cjs
      - name: Verificar TypeScript do frontend React
        run: npm run typecheck:frontend
      - name: Compilar frontend React pelo Vite
        run: npm run build
      - name: Verificar segurança do boot (ambiente simulado)
        run: |
          node src/services/envBoot.test.js
          node --test src/services/envBoot.contract.test.js
      - name: Testar buildInfo com Docker simulado e fallback local
        run: node --test src/services/buildInfo.test.js
      - name: Testar contratos Mercado Pago e aprovação de planos sem rede
        run: |
          node src/services/mpPlanRules.test.js
          node --test src/services/mpPlanRules.contract.test.js
      - name: Testar ciclo de créditos com Firestore simulado
        run: node --test src/services/creditService.contract.test.js
      - name: Verificar reservas e cálculo do custo por modelo (sem API real)
        run: |
          node --test src/services/aiBudgetGeminiClient.test.js
          node --test src/services/aiBudgetLedger.test.js
          node --test src/services/aiCreditsV2.test.js
          node --test src/services/aiCreditsV2Mode.test.js
          node --test src/services/aiCreditsV2Http.test.js
          node --test src/services/planPricingParity.test.js
          node --test src/services/solarisGithubApp.test.js
          node --test src/solaris/http/solarisHttpHandlers.test.js
      - name: Testar SMTP Resend e templates sem envio real
        run: node --test src/services/emailService.contract.test.js
      - name: Testar captura e retenção de erros sem listeners reais
        run: node --test src/services/errorLogWorker.contract.test.js
      - name: Verificar guards de acesso e rotas do dashboard migradas (sem rede)
        run: node --test src/middlewares/backendMigration.contract.test.js src/routes/dashboard_routes/backendMigration.contract.test.js
      - name: Testar entradas do dashboard e historico do chat sem dependencias externas
        run: node --test src/routes/dashboard_routes/dashboardEntries.contract.test.js src/routes/api_routes/appConfig.contract.test.js src/routes/dashboard_routes/chat/chatHistory.test.js
      - name: Testar parser de palavras do RAG, padroes visuais e headers HTTP migrados
        run: |
          node src/rag/ragMatcher.test.js
          node src/rag/design-rules/padroesVisuais.test.js
          node --test src/middlewares/securityHeaders.contract.test.js
      - name: Verificar TypeScript, espelhos e auditoria
        run: npm run typecheck
      - name: Regressões do editor e auditoria TypeScript
        run: |
          node src/ai/templateEditSchema.test.js
          node src/ai/templateEditAgent.test.js
          node src/ai/pecaRequestSchema.test.js
          node src/ai/pecaRequestSchemaContract.test.js
          node src/ai/templateEditAgentContract.test.js
          node src/core/typescriptMigrationAudit.test.js
          node src/core/testRunnerDiscovery.test.js
          node src/core/vendorAssets.test.js
          node src/core/vendorTemplateRefs.test.js
          node src/core/vendorStaticPolicy.test.js
          node src/core/brandingMigration.test.js
          node scripts/compile-batch.test.js
          node scripts/extractTemplate.test.js
          node src/core/parser/ejsParser.test.js
          node src/core/parser/phpParser.test.js
          node src/core/parser/cssParser.test.js
          node src/core/parser/htmlParser.test.js
          node src/core/parser/xmlParser.test.js
          node src/core/parser/jsParser.test.js
          node src/core/telemetria.test.js
          node src/core/designVoicePresets.test.js
          node src/core/nichoModuleDefaults.test.js
          node src/core/presets.test.js
          node src/core/codeValidator.test.js
          node src/core/skeletonRedactor.test.js
          node src/ai/solConhecimentoTecnico.test.js
          node src/core/xmlValidator.test.js
          node src/core/compilerPipeline.test.js
          node src/core/templateExtractor.test.js
          node src/core/modules.test.js
          node src/ai/solAgent.test.js
          node src/solaris/rag/codeCorpus.test.js
          node scripts/ragCodeIndexMigration.test.js
          node src/solaris/rag/codeCollectorSafety.test.js
          node src/solaris/rag/codeVectorStoreContract.test.js
          node src/solaris/rag/codeSearchIsolation.test.js
          node src/solaris/rag/ragChunker.test.js
          node src/solaris/rag/ragEntryText.test.js
          node src/solaris/rag/ragTopicMatrix.test.js
          node src/solaris/rag/ragDeduplicator.test.js
          node src/solaris/rag/ragVectorStore.test.js
          node src/solaris/rag/ragSearchService.test.js
          node src/solaris/rag/ragPromptContext.test.js
          node src/solaris/rag/ragEmbeddingsClient.test.js
          node src/solaris/rag/ragEntryGenerator.test.js
          node src/solaris/rag/ragCatalogLoader.test.js
          node src/solaris/workers/ragOrganizerWorker.test.js
          node src/solaris/workers/ragDraftWorker.test.js
          node src/solaris/workers/ragKebabWorker.test.js
          node src/solaris/workers/htmlWorker.test.js
          node src/solaris/workers/cssWorker.test.js
          node src/solaris/workers/jsWorker.test.js
          node src/solaris/workers/jsonWorker.test.js
          node src/solaris/workers/phpWorker.test.js
          node src/solaris/workers/pythonWorker.test.js
          node src/solaris/workers/ejsWorker.test.js
          node src/solaris/manifest/manifestSchema.test.js
          node src/solaris/tools/frameworkDetector.test.js
          node src/solaris/pipeline/projectInspector.test.js
          node src/solaris/pipeline/projectMemory.test.js
          node src/solaris/tools/fileTools.test.js
          node src/solaris/tools/archiveExtractClient.test.js
          node src/solaris/tools/projectStorage.test.js
          node src/solaris/tools/projectStorage.transaction.test.js
          node src/services/storageQuotaIdempotency.test.js
          node src/services/chatStorageQuota.test.js
          node src/solaris/tools/projectLockRecovery.test.js
          node src/solaris/chat/solarisGenerationTrigger.test.js
          node src/solaris/prompts/systemPrompt.test.js
          # Asset Forge rendering tests run in asset-forge.yml with Python/Pillow/ffmpeg.
          node src/solaris/pipeline/projectEditor.test.js
          node src/solaris/pipeline/orchestrator.test.js
          node src/solaris/llm/modelRouter.test.js
          node src/solaris/chat/solarisChat.test.js
          node src/solaris/http/solarisHttpProtocol.test.js
          node src/solaris/http/solarisHttpHandlers.test.js
          node src/solaris/http/solarisBilling.test.js
