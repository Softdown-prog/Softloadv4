# Reduce repeated Dependabot PRs without disabling security alerts.
# Non-breaking fixes are grouped; major upgrades remain separate for review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "firebase-admin"
          - "mercadopago"
        update-types:
          - "patch"
          - "minor"
      versions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "firebase-admin"
          - "mercadopago"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "npm"
    directory: "/agent"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "firebase-admin"
          - "mercadopago"
        update-types:
          - "patch"
          - "minor"
      versions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "firebase-admin"
          - "mercadopago"
        update-types:
          - "patch"
          - "minor"
